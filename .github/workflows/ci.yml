name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  dart-tests:
    name: Dart analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows-x64:
    name: Windows x64 (flutter build)
    runs-on: windows-latest
    needs: dart-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build FFmpeg dev layout (vcpkg, LGPL)
        shell: pwsh
        run: |
          if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
          git clone --depth 1 https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install ffmpeg --triplet x64-windows
      - name: Stage FFmpeg layout for plugin discovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/ffmpeg/windows-x64 | Out-Null
          Copy-Item -Recurse -Force vcpkg/installed/x64-windows/include native/ffmpeg/windows-x64/
          Copy-Item -Recurse -Force vcpkg/installed/x64-windows/lib native/ffmpeg/windows-x64/
          Copy-Item -Recurse -Force vcpkg/installed/x64-windows/bin native/ffmpeg/windows-x64/
      - name: Compile dcaenc (MSVC)
        shell: cmd
        run: |
          git clone --depth 1 https://gitlab.com/patrakov/dcaenc.git native\dcaenc\dcaenc-src
          copy /y NUL native\dcaenc\dcaenc-src\config.h
          mkdir native\dcaenc\windows-x64\bin native\dcaenc\windows-x64\include native\dcaenc\windows-x64\lib
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd native\dcaenc\dcaenc-src
          cl /O2 gentables.c
          gentables.exe > math_tables.c
          cl /O2 /LD dcaenc.c math_tables.c /Fe:..\windows-x64\bin\dcaenc.dll /link /DEF:..\..\..\tool\dcaenc.def /MACHINE:X64
          copy /y dcaenc.h ..\windows-x64\include\dcaenc.h
          copy /y dcaenc.lib ..\windows-x64\lib\dcaenc.lib
      - name: Build example (auto-start smoke session)
        run: flutter build windows --release --dart-define=SURROUND_AUTO_START=true
        working-directory: example

  windows-arm64:
    name: Windows arm64 (plugin cross-build)
    runs-on: windows-latest
    needs: dart-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build FFmpeg dev layout (vcpkg, LGPL)
        shell: pwsh
        run: |
          if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
          git clone --depth 1 https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install ffmpeg --triplet arm64-windows
      - name: Stage FFmpeg layout and configure plugin for ARM64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/ffmpeg/windows-arm64 | Out-Null
          Copy-Item -Recurse -Force vcpkg/installed/arm64-windows/include native/ffmpeg/windows-arm64/
          Copy-Item -Recurse -Force vcpkg/installed/arm64-windows/lib native/ffmpeg/windows-arm64/
          Copy-Item -Recurse -Force vcpkg/installed/arm64-windows/bin native/ffmpeg/windows-arm64/
      - name: Compile dcaenc (MSVC cross to ARM64)
        shell: cmd
        run: |
          git clone --depth 1 https://gitlab.com/patrakov/dcaenc.git native\dcaenc\dcaenc-src
          copy /y NUL native\dcaenc\dcaenc-src\config.h
          mkdir native\dcaenc\windows-arm64\bin native\dcaenc\windows-arm64\include native\dcaenc\windows-arm64\lib
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          cd native\dcaenc\dcaenc-src
          cl /O2 gentables.c
          gentables.exe > math_tables.c
          cl /O2 /LD dcaenc.c math_tables.c /Fe:..\windows-arm64\bin\dcaenc.dll /link /DEF:..\..\..\tool\dcaenc.def /MACHINE:ARM64
          copy /y dcaenc.h ..\windows-arm64\include\dcaenc.h
          copy /y dcaenc.lib ..\windows-arm64\lib\dcaenc.lib
      - name: Configure plugin for ARM64
        shell: pwsh
        run: |
          cmake -S windows -B build-arm64 -A ARM64 `
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=arm64-windows
          cmake --build build-arm64 --config Release

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: dart-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            triplet: arm64-osx
          - os: macos-13
            arch: x64
            triplet: x64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build FFmpeg dev layout (vcpkg, LGPL)
        run: |
          if [ -d vcpkg ]; then rm -rf vcpkg; fi
          git clone --depth 1 https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install ffmpeg --triplet ${{ matrix.triplet }}
      - name: Stage FFmpeg layout
        run: |
          mkdir -p native/ffmpeg/${{ matrix.triplet }}
          cp -R vcpkg/installed/${{ matrix.triplet }}/include native/ffmpeg/${{ matrix.triplet }}/
          cp -R vcpkg/installed/${{ matrix.triplet }}/lib native/ffmpeg/${{ matrix.triplet }}/
      - name: Build dcaenc
        run: bash tool/setup_dcaenc.sh ${{ matrix.triplet }}
      - name: Build example
        run: flutter build macos --release
        working-directory: example
        env:
          SURROUND_ENCODER_FFMPEG_ROOT: ${{ github.workspace }}/native/ffmpeg/${{ matrix.triplet }}
          SURROUND_ENCODER_DCAENC_ROOT: ${{ github.workspace }}/native/dcaenc/${{ matrix.triplet }}

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: dart-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      # subosito/flutter-action cannot resolve Linux arm64 Flutter from its
      # manifest, so install the official tarball directly on that arch.
      - name: Install Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          curl -L -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xf /tmp/flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libpulse-dev \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev
      - name: Build dcaenc
        run: bash tool/setup_dcaenc.sh
      - name: Build example
        run: flutter build linux --release
        working-directory: example
